[pytest]
# Pytest configuration for Mindmap Agent evaluation tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    unit: Unit tests for individual metrics
    integration: Integration tests for complete evaluation flow
    slow: Tests that take longer to run

# Logging
log_cli = false
log_cli_level = INFO
